name: BREU - Ala 03 / testes de física
on:
  push:
    paths:
      - 'laboratorio/**'
      - '.github/workflows/breu-lab-ci.yml'
  pull_request:
    paths:
      - 'laboratorio/**'
jobs:
  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: laboratorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:physics
