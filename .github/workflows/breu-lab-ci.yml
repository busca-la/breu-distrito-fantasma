name: BREU - Ala 03 / testes de física
on:
  push:
    paths:
      - 'laboratorio/**'
      - '.github/workflows/breu-lab-ci.yml'
  pull_request:
    paths:
      - 'laboratorio/**'
jobs:
  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: laboratorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Física Rapier WASM (logs resumidos)\n        run: |\n          npm run test:physics > /tmp/breu-physics.log 2>&1 || {\n            tail -c 2200 /tmp/breu-physics.log\n            exit 1\n          }\n          cat /tmp/breu-physics.log
